<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGoogleMap 美食景點隨機抽籤</title>
  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables for Warm Food Appetite Aesthetics */
    :root {
      --bg-gradient: linear-gradient(135deg, #1a1210 0%, #2b1a12 100%);
      --panel-bg: rgba(43, 26, 18, 0.55);
      --border-color: rgba(255, 237, 213, 0.10);
      --border-hover: rgba(255, 237, 213, 0.22);
      --text-primary: #fff7ed;
      --text-secondary: #a8836b;
      --accent-color: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.4);
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
      --accent-secondary: #fb923c;
      --card-bg: rgba(26, 18, 16, 0.6);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.4), 0 8px 10px -6px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 30px rgba(249, 115, 22, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Background decorative glowing orbs */
    .bg-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(249,115,22,0) 70%);
      z-index: -1;
      filter: blur(40px);
    }
    .orb-1 { top: 10%; left: 5%; }
    .orb-2 { bottom: 10%; right: 5%; background: radial-gradient(circle, rgba(239,68,68,0.15) 0%, rgba(239,68,68,0) 70%); }

    header {
      text-align: center;
      margin-bottom: 2rem;
      z-index: 10;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #fb923c 0%, #f97316 50%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 300;
    }

    .main-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 10;
    }

    /* Preset chip bar */
    .preset-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.25rem; -webkit-overflow-scrolling: touch; }
    .preset-chip { white-space: nowrap; padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; border: 1px solid var(--border-color);
      background: rgba(43,26,18,0.5); color: var(--text-secondary); transition: all 0.2s ease; }
    .preset-chip:hover { color: var(--text-primary); border-color: var(--border-hover); }
    .preset-chip.active { background: var(--accent-gradient); color: #fff; border-color: transparent;
      box-shadow: 0 6px 16px -4px var(--accent-glow); }
    .preset-chip.custom { font-style: italic; }

    /* Collapsible advanced panel */
    .advanced-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-primary);
      border-radius: 12px; padding: 0.85rem 1.1rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .advanced-toggle .chev { transition: transform 0.2s ease; }
    .advanced-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .advanced-panel { background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
      border-top: none; border-radius: 0 0 16px 16px; padding: 1.5rem; margin-top: -6px; }
    .advanced-panel[hidden] { display: none; }

    .filter-section {
      margin-bottom: 1.75rem;
    }

    .filter-section:last-child {
      margin-bottom: 0;
    }

    .filter-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-actions {
      font-size: 0.8rem;
      display: flex;
      gap: 0.5rem;
    }

    .filter-actions a {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .filter-actions a:hover {
      color: #818cf8;
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }

    .checkbox-label:hover {
      color: var(--text-primary);
    }

    .checkbox-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--border-color);
      border-radius: 4px;
      outline: none;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .checkbox-label input[type="checkbox"]:checked {
      background: var(--accent-gradient);
      border-color: transparent;
    }

    .checkbox-label input[type="checkbox"]:checked::before {
      content: '✓';
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Visited Select Radio Options */
    .radio-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.4);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .radio-option input[type="radio"] {
      display: none;
    }

    .radio-option label {
      display: block;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option input[type="radio"]:checked + label {
      background: var(--accent-color);
      color: #fff;
      font-weight: 500;
    }

    /* Main Lottery Area */
    .draw-area {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Counter card */
    .counter-card {
      background: rgba(43, 26, 18, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .counter-val {
      font-weight: 700;
      color: var(--accent-secondary);
    }

    /* Draw Board */
    .draw-board {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 450px;
      position: relative;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      transition: border-color 0.3s ease;
    }

    .draw-board.spinning {
      border-color: rgba(249, 115, 22, 0.4);
    }

    /* Large Draw Button */
    .btn-draw {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 1.25rem 3rem;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px var(--accent-glow), 0 0 20px rgba(249, 115, 22, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-draw:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px -5px rgba(249, 115, 22, 0.6), 0 0 30px rgba(249, 115, 22, 0.4);
    }

    .btn-draw:active:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-draw:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Shuffling Card Display */
    .shuffling-card {
      font-size: 2.2rem;
      font-weight: 800;
      color: #f8fafc;
      text-align: center;
      margin-bottom: 2rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 1rem;
      transition: transform 0.1s ease;
    }

    .shuffling-card.pulse {
      transform: scale(1.03);
      color: var(--accent-secondary);
    }

    /* Result Card (Winner) */
    .result-card {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      transform: scale(0.9);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: absolute;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .result-card.show {
      transform: scale(1);
      opacity: 1;
      position: relative;
      pointer-events: auto;
    }

    .result-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 1rem;
    }

    .result-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }

    .badge-cuisine {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .badge-distance {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-price {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .badge-visit {
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .result-details {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.95rem;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .detail-label {
      color: var(--text-secondary);
      min-width: 70px;
      font-weight: 500;
    }

    .detail-value {
      color: var(--text-primary);
    }

    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-maps:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-draw-again {
      background: transparent;
      color: var(--text-secondary);
      border: none;
      margin-top: 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s ease;
      text-decoration: underline;
    }

    .btn-draw-again:hover {
      color: #fff;
    }

    /* Confetti Particle CSS animation */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      animation: fall 3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(400px) translateX(var(--x-offset)) rotate(360deg);
        opacity: 0;
      }
    }

    /* Helper styles for blank state */
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
    }
    
    .empty-state h3 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Decorative Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header>
    <h1>🍜 今天吃什麼</h1>
    <p>篩選並抽出您的下一個美食地標</p>
  </header>

  <div class="main-container">

    <!-- 情境快捷列（chips 由 Task 7 JS 填入） -->
    <div id="preset-bar" class="preset-bar">
      <span id="custom-flag" class="preset-chip custom" hidden>✎ 自訂</span>
      <!-- chips 由 JS 依 LotteryLogic.PRESET_NAMES 產生 -->
    </div>

    <!-- 可收合進階篩選面板 -->
    <div class="advanced">
      <button type="button" id="advanced-toggle" class="advanced-toggle" aria-expanded="false">
        <span>⚙ 進階篩選</span><span class="chev">▾</span>
      </button>
      <div id="advanced-panel" class="advanced-panel" hidden>

        <!-- 加權抽籤開關 -->
        <label class="checkbox-label" style="margin-bottom:1rem;">
          <input type="checkbox" id="weight-toggle" checked> ⚡ 加權抽籤（近／營業中優先）
        </label>

        <!-- Visited Status Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>回訪狀態</span>
          </div>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="visit-all" name="visit-status" value="all" checked>
              <label for="visit-all">全部</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="visit-yes" name="visit-status" value="yes">
              <label for="visit-yes">曾去過</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="visit-no" name="visit-status" value="no">
              <label for="visit-no">未去過</label>
            </div>
          </div>
        </div>

        <!-- Business Hours Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>營業時間</span>
            <div class="filter-actions">
              <a onclick="selectAll('hours', true)">全選</a>
              <span>|</span>
              <a onclick="selectAll('hours', false)">全不選</a>
            </div>
          </div>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="open-now" checked> 營業中（依現在時間）
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="breakfast"> 早餐 (05:00–10:30)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="lunch"> 中餐 (10:30–14:00)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="tea"> 下午茶 (14:00–17:00)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="dinner"> 晚餐 (17:00–21:00)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="latenight"> 消夜 (21:00–05:00)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="hours" value="unknown"> 未知（無營業時間資料）
            </label>
          </div>
        </div>

        <!-- Cuisine Type Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>餐飲類型</span>
            <div class="filter-actions">
              <a onclick="selectAll('cuisine', true)">全選</a>
              <span>|</span>
              <a onclick="selectAll('cuisine', false)">全不選</a>
            </div>
          </div>
          <div class="checkbox-group" id="cuisine-group">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Distance Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>距離住家</span>
            <div class="filter-actions">
              <a onclick="selectAll('distance', true)">全選</a>
              <span>|</span>
              <a onclick="selectAll('distance', false)">全不選</a>
            </div>
          </div>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="1" checked> 1公里內
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="3" checked> 1~3公里
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="5"> 3~5公里
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="10"> 5~10公里
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="far"> 10公里以上
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="distance" value="unknown"> 未知距離
            </label>
          </div>
        </div>

        <!-- Price Range Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>人均消費</span>
            <div class="filter-actions">
              <a onclick="selectAll('price', true)">全選</a>
              <span>|</span>
              <a onclick="selectAll('price', false)">全不選</a>
            </div>
          </div>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" name="price" value="200" checked> 200元內 (平價)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="price" value="500" checked> 200~500元 (中價位)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="price" value="1000"> 500~1000元 (中高檔)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="price" value="expensive"> 1000元以上 (奢華)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="price" value="free"> 未知/免費景點
            </label>
          </div>
        </div>

        <!-- County Filter -->
        <div class="filter-section">
          <div class="filter-title">
            <span>縣市</span>
            <div class="filter-actions">
              <a onclick="selectAll('county', true)">全選</a>
              <span>|</span>
              <a onclick="selectAll('county', false)">全不選</a>
            </div>
          </div>
          <div class="checkbox-group" id="county-group">
            <!-- Populated by JS -->
          </div>
        </div>

      </div><!-- /#advanced-panel -->
    </div><!-- /.advanced -->

    <!-- Main Lottery Section -->
    <main class="draw-area">

      <!-- Counter Status -->
      <div class="counter-card">
        <span>符合目前篩選條件的店家數量：</span>
        <span class="counter-val" id="matching-count">0</span>
      </div>

      <!-- Draw Board Container -->
      <div class="draw-board" id="board">
        
        <!-- Shuffling text (visible when drawing) -->
        <div class="shuffling-card" id="shuffling-text" style="display: none;">
          準備中...
        </div>

        <!-- Initial Blank State / Draw Button -->
        <div class="empty-state" id="initial-state">
          <h3>今天吃什麼？</h3>
          <p style="margin-bottom: 2rem;">設定篩選條件或情境，然後點擊下方按鈕開始隨機抽籤</p>
          <button type="button" class="btn-draw" id="btn-start" onclick="drawLottery()">
            <span>✨ 開始抽籤</span>
          </button>
        </div>

        <!-- Winner Result Card -->
        <div class="result-card" id="result-card">
          <div class="result-header">
            <div class="result-title" id="winner-title">鼎泰豐</div>
            <div class="result-tags">
              <span class="badge" id="winner-tag-fallback" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); display: none;">⚠️ 零符合項目 (已從全部抽選)</span>
              <span class="badge badge-cuisine" id="winner-tag-cuisine">中式</span>
              <span class="badge badge-distance" id="winner-tag-distance">1.2 km</span>
              <span class="badge badge-price" id="winner-tag-price">均消 450 元</span>
              <span class="badge badge-visit" id="winner-tag-visit">曾去過 (回訪)</span>
              <span class="badge" id="winner-tag-hours" style="display: none;"></span>
            </div>
          </div>

          <div class="result-details">
            <div class="detail-row">
              <span class="detail-label">地址：</span>
              <span class="detail-value" id="winner-address">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">來源清單：</span>
              <span class="detail-value" id="winner-source">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">備註：</span>
              <span class="detail-value" id="winner-note">-</span>
            </div>
          </div>

          <a href="#" target="_blank" class="btn-maps" id="winner-map-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            在 Google 地圖中開啟
          </a>

          <button type="button" class="btn-draw-again" onclick="resetDraw()">重新抽籤</button>
        </div>

      </div>

    </main>

  </div>

  <!-- 載入自動產生的店家資料檔 -->
  <script src="data/output/stores_data.js"></script>

  <!-- 營業時間判斷純函式（供瀏覽器與 Node 共用） -->
  <script src="hours_logic.js"></script>

  <!-- 抽籤邏輯純模組（Task 7 接線） -->
  <script src="lottery_logic.js"></script>

  <script>
    // Fallback in case stores_data.js is not loaded
    if (typeof window.STORES_DATA === 'undefined') {
      window.STORES_DATA = [];
      alert("警告：未偵測到 'stores_data.js' 資料庫檔案！請先執行 'export_to_sheets.py' 以產生店家資料庫。");
    }

    const stores = window.STORES_DATA;
    let filteredStores = [];

    // === Step 1: 改用模組 + 計算覆蓋率/縣市 ===
    const LL = window.LotteryLogic;
    window.APP_COVERAGE = LL.computeCoverage(stores);
    const DATA_COUNTIES = Array.from(new Set(
      stores.map(s => LL.extractCounty(s.address)).filter(Boolean)
    ));
    window.DATA_COUNTIES = DATA_COUNTIES;

    function populateCountyFilters() {
      // 收集資料中實際出現的縣市（依 TAIWAN_COUNTIES 順序）
      const found = new Set(DATA_COUNTIES);
      const sorted = LL.TAIWAN_COUNTIES.filter(c => found.has(c));
      const container = document.getElementById('county-group');
      container.innerHTML = '';

      sorted.forEach(c => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.name = 'county';
        cb.value = c;
        cb.checked = (c === '新竹市');   // 預設只勾選新竹市
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + c));
        container.appendChild(label);
      });

      // 未知/非台灣 → 預設不勾
      const labelUnknown = document.createElement('label');
      labelUnknown.className = 'checkbox-label';
      const cbUnknown = document.createElement('input');
      cbUnknown.type = 'checkbox';
      cbUnknown.name = 'county';
      cbUnknown.value = 'unknown';
      cbUnknown.checked = false;
      labelUnknown.appendChild(cbUnknown);
      labelUnknown.appendChild(document.createTextNode(' 未知/非台灣'));
      container.appendChild(labelUnknown);
    }

    // Detect unique cuisines from stores database
    function getCuisineTypes() {
      const cuisineSet = new Set();
      cuisineSet.add("中式");
      cuisineSet.add("日式");
      cuisineSet.add("義式");
      cuisineSet.add("美式");
      cuisineSet.add("韓式");
      cuisineSet.add("東南亞式");
      cuisineSet.add("其他");

      // Also grab any other custom classifications written by Gemini
      stores.forEach(s => {
        if (s.cuisine_type) {
          s.cuisine_type.split(',').forEach(c => {
            const normalized = LL.normalizeCuisine(c.trim());
            if (normalized) cuisineSet.add(normalized);
          });
        }
      });
      return Array.from(cuisineSet);
    }

    // Populate Cuisine Filter UI Checkboxes
    function populateCuisineFilters() {
      const cuisines = getCuisineTypes();
      const container = document.getElementById('cuisine-group');
      container.innerHTML = '';

      cuisines.forEach(c => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = 'cuisine';
        checkbox.value = c;
        checkbox.checked = true;

        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(' ' + c));
        container.appendChild(label);
      });
    }

    // Helper: Bulk Select / Deselect check groups
    function selectAll(groupName, isChecked) {
      const boxes = document.querySelectorAll(`input[name="${groupName}"]`);
      boxes.forEach(box => box.checked = isChecked);
      updateFilters();
    }

    // === Step 2: getCurrentFilters ===
    function getCurrentFilters() {
      const visit = document.querySelector('input[name="visit-status"]:checked').value;
      const cuisineBoxes = Array.from(document.querySelectorAll('input[name="cuisine"]'));
      const allCuisineChecked = cuisineBoxes.every(b => b.checked);
      const cuisines = allCuisineChecked ? null
        : new Set(cuisineBoxes.filter(b => b.checked).map(b => b.value));
      const setOf = name => new Set(
        Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(b => b.value));
      return {
        visit,
        cuisines,
        distances: setOf('distance'),
        prices: setOf('price'),
        counties: setOf('county'),
        hours: setOf('hours'),
      };
    }

    // === Step 3: updateFilters 用 LL.storeMatches ===
    function updateFilters() {
      const filters = getCurrentFilters();
      const now = new Date();
      filteredStores = stores.filter(s => LL.storeMatches(s, filters, now));
      const countEl = document.getElementById('matching-count');
      if (filteredStores.length === 0) {
        countEl.innerHTML = `0 <span style="color:var(--text-secondary);font-size:0.85rem;font-weight:normal;">(無符合，將從全部抽)</span>`;
        document.getElementById('btn-start').disabled = stores.length === 0;
      } else {
        countEl.textContent = String(filteredStores.length);
        document.getElementById('btn-start').disabled = false;
      }
    }

    // === Step 4: 情境鍵 ===
    const PRESET_EMOJI = { '智慧推薦': '🎯', '附近': '📍', '沒去過': '🆕', '現在營業': '🍜', '全部隨機': '🎲' };
    let activePreset = null;
    let applyingPreset = false;

    function renderPresetBar() {
      const bar = document.getElementById('preset-bar');
      // Remove existing chips (keep #custom-flag)
      bar.querySelectorAll('.preset-chip:not(#custom-flag)').forEach(c => c.remove());
      LL.PRESET_NAMES.forEach(name => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'preset-chip';
        chip.dataset.preset = name;
        chip.textContent = `${PRESET_EMOJI[name] || ''} ${name}`;
        chip.addEventListener('click', () => applyPreset(name));
        bar.appendChild(chip);
      });
    }

    function setCheckboxes(name, values /* Set|null=all */) {
      document.querySelectorAll(`input[name="${name}"]`).forEach(b => {
        b.checked = (values == null) ? true : values.has(b.value);
      });
    }

    function applyPreset(name) {
      applyingPreset = true;
      const f = LL.resolvePreset(name, window.APP_COVERAGE, window.DATA_COUNTIES);
      document.querySelector(`input[name="visit-status"][value="${f.visit}"]`).checked = true;
      setCheckboxes('cuisine', f.cuisines);
      setCheckboxes('distance', f.distances);
      setCheckboxes('price', f.prices);
      setCheckboxes('county', f.counties);
      setCheckboxes('hours', f.hours);
      document.getElementById('weight-toggle').checked = f.weightOn;
      activePreset = name;
      highlightPreset();
      updateFilters();
      applyingPreset = false;
    }

    function highlightPreset() {
      document.querySelectorAll('.preset-chip:not(#custom-flag)').forEach(c => {
        c.classList.toggle('active', c.dataset.preset === activePreset);
        c.classList.remove('custom');
      });
      const customFlag = document.getElementById('custom-flag');
      if (activePreset) {
        customFlag.hidden = true;
      } else {
        customFlag.hidden = false;
      }
    }

    // Reset board back to initial draw button state
    function resetDraw() {
      document.getElementById('result-card').classList.remove('show');
      document.getElementById('initial-state').style.display = 'block';
      document.getElementById('shuffling-text').style.display = 'none';
      document.getElementById('board').classList.remove('spinning');
    }

    // Confetti Effect for Winner
    function createConfetti() {
      const colors = ['#f97316', '#ef4444', '#fb923c', '#fbbf24', '#fde68a'];
      const board = document.getElementById('board');
      for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 90 + 5 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.setProperty('--x-offset', (Math.random() * 200 - 100) + 'px');
        // Random dimensions
        const size = Math.random() * 8 + 6 + 'px';
        confetti.style.width = size;
        confetti.style.height = size;
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        
        board.appendChild(confetti);
        
        // Remove element after animation finishes
        setTimeout(() => confetti.remove(), 3500);
      }
    }

    // Trigger Slot Machine Draw Animation
    function drawLottery() {
      let drawPool = filteredStores;
      let isFallback = false;
      if (drawPool.length === 0) {
        drawPool = stores;
        isFallback = true;
      }
      if (drawPool.length === 0) return;

      const board = document.getElementById('board');
      const initialState = document.getElementById('initial-state');
      const shufflingText = document.getElementById('shuffling-text');
      const resultCard = document.getElementById('result-card');

      // 1. Swap visibility to shuffling text
      initialState.style.display = 'none';
      shufflingText.style.display = 'flex';
      board.classList.add('spinning');
      
      let duration = 2500; // total animation time in ms
      let interval = 50;   // starting speed of card changes
      let elapsedTime = 0;

      // Cycle function that speeds up and then slows down
      function shuffle() {
        // Randomly pick a candidate from draw pool
        const tempWinner = drawPool[Math.floor(Math.random() * drawPool.length)];
        shufflingText.innerText = tempWinner.title;
        shufflingText.classList.toggle('pulse');

        elapsedTime += interval;

        if (elapsedTime < duration) {
          // Slow down the cycles near the end
          if (elapsedTime > duration * 0.75) {
            interval = 200;
          } else if (elapsedTime > duration * 0.5) {
            interval = 120;
          }
          setTimeout(shuffle, interval);
        } else {
          // Show the final winner
          displayWinner(isFallback);
        }
      }

      shuffle();
    }

    // Display final winning restaurant on board
    function displayWinner(isFallback) {
      const pool = isFallback ? stores : filteredStores;
      const winner = pool[Math.floor(Math.random() * pool.length)];
      
      document.getElementById('shuffling-text').style.display = 'none';
      document.getElementById('board').classList.remove('spinning');

      // Populate Winner Details
      document.getElementById('winner-title').innerText = winner.title;
      document.getElementById('winner-tag-cuisine').innerText = winner.cuisine_type;
      
      // Format Fallback Badge
      const fallbackBadge = document.getElementById('winner-tag-fallback');
      if (isFallback) {
        fallbackBadge.style.display = 'inline-block';
      } else {
        fallbackBadge.style.display = 'none';
      }

      // Format Distance Badge
      const distBadge = document.getElementById('winner-tag-distance');
      if (winner.distance_km !== null && winner.distance_km !== undefined) {
        distBadge.innerText = `距離住家 ${winner.distance_km} km`;
        distBadge.style.display = 'inline-block';
      } else {
        distBadge.style.display = 'none';
      }

      // Format Price Badge
      const priceBadge = document.getElementById('winner-tag-price');
      if (winner.avg_spending && winner.avg_spending > 0) {
        priceBadge.innerText = `人均 NT$ ${winner.avg_spending}`;
        priceBadge.style.display = 'inline-block';
      } else {
        priceBadge.innerText = '未知/免費用餐';
        priceBadge.style.display = 'inline-block';
      }

      // Format Visited Badge
      const visitBadge = document.getElementById('winner-tag-visit');
      if (winner.visited === '是') {
        visitBadge.innerText = '已去過 (回訪)';
        visitBadge.style.background = 'rgba(236, 72, 153, 0.15)';
      } else {
        visitBadge.innerText = '未去過 (想去)';
        visitBadge.style.background = 'rgba(148, 163, 184, 0.15)';
      }

      // Business Hours Badge
      const hoursBadge = document.getElementById('winner-tag-hours');
      if (!winner.hours || winner.hours.length === 0) {
        hoursBadge.innerText = '營業時間未知';
        hoursBadge.style.background = 'rgba(148, 163, 184, 0.15)';
        hoursBadge.style.color = '#94a3b8';
        hoursBadge.style.border = '1px solid rgba(148, 163, 184, 0.3)';
      } else if (window.HoursLogic.isOpenNow(winner.hours, new Date())) {
        hoursBadge.innerText = '營業中';
        hoursBadge.style.background = 'rgba(34, 197, 94, 0.15)';
        hoursBadge.style.color = '#4ade80';
        hoursBadge.style.border = '1px solid rgba(34, 197, 94, 0.3)';
      } else {
        hoursBadge.innerText = '已打烊';
        hoursBadge.style.background = 'rgba(148, 163, 184, 0.15)';
        hoursBadge.style.color = '#94a3b8';
        hoursBadge.style.border = '1px solid rgba(148, 163, 184, 0.3)';
      }
      hoursBadge.style.display = 'inline-block';

      document.getElementById('winner-address').innerText = winner.address || '無登記地址';
      document.getElementById('winner-source').innerText  = winner.source_list || '-';
      document.getElementById('winner-note').innerText    = winner.note || '無填寫備註';

      // Maps Button
      const mapsBtn = document.getElementById('winner-map-link');
      if (winner.url) {
        mapsBtn.href = winner.url;
        mapsBtn.style.display = 'flex';
      } else {
        mapsBtn.style.display = 'none';
      }

      // Show Result Card
      document.getElementById('result-card').classList.add('show');
      
      // Throw confetti!
      createConfetti();
    }

    // === Step 6: 初始化 ===
    populateCuisineFilters();
    populateCountyFilters();
    renderPresetBar();

    // 進階面板收合鈕
    const at = document.getElementById('advanced-toggle');
    at.addEventListener('click', () => {
      const panel = document.getElementById('advanced-panel');
      const open = panel.hasAttribute('hidden');
      if (open) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', '');
      at.setAttribute('aria-expanded', String(open));
    });

    // === Step 5: 手動改動 → 自訂 ===
    document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => {
      el.addEventListener('change', () => {
        if (!applyingPreset) { activePreset = null; highlightPreset(); }
        updateFilters();
      });
    });

    // 載入即套「智慧推薦」→ 不會空池
    applyPreset('智慧推薦');
  </script>
</body>
</html>
